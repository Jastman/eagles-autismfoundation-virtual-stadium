[/Script/Engine.RendererSettings]
; UE5 default, missing from this hand-written ini. Without it auto exposure uses the UE4 luminance range and
; CesiumSunSky's physical sun (~110,000 lux) blows the whole frame out to white, tiles included.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Cinematic real-time lighting (the rest of the UE5 defaults this ini was missing). All lighting is dynamic:
; Lumen global illumination and reflections, virtual shadow maps for crisp sun shadows at stadium scale, and
; mesh distance fields for software Lumen on Mac (Nanite fallback meshes feed them). No lightmaps to build.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.Lumen.TraceMeshSDFs=1
; Temporal Super Resolution anti-aliasing (UE5 default), made explicit.
r.AntiAliasingMethod=4
; Calm, comfortable picture (ACCESSIBILITY.md: no flashing, predictable motion): no motion blur or lens flares
; by default. The post process volume in L_LFF_Stadium sets the same, so this is belt and braces.
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False

[SystemSettings]
; Lumen's cached lighting and the real-time sky capture are stored pre-exposed. The default (4) covers about
; EV -8..12; the sunlit site reaches EV 15, so the cached lighting clipped and shaded stands went near-black.
; 8 covers about EV -4..16, the full physically based range (engine cvar help text).
r.EyeAdaptation.CachedLightingPreExposure=8
; The stadium, ~900 cars and the MetaHuman crowd's textures need more than the 1 GB default pool (it blurred them).
r.Streaming.PoolSize=4000
; The crowd's skinned instances aren't Nanite; the shadow cache can overflow on wide views. Not a message for visitors.
r.Shadow.Virtual.AllowScreenOverflowMessages=0

